# Local stack: Postgres + Redis + anvil. Run the API/worker with `npm run dev:*` (see README),
# or uncomment `api`/`worker` to run the production image.
services:
  postgres:
    image: postgres:16
    environment: { POSTGRES_PASSWORD: postgres, POSTGRES_DB: kronos }
    ports: ["5432:5432"]
  redis:
    image: redis:7
    ports: ["6379:6379"]
  anvil:
    image: ghcr.io/foundry-rs/foundry:stable
    entrypoint: ["anvil", "--host", "0.0.0.0"]
    ports: ["8545:8545"]
